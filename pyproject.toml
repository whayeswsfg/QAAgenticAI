[project]
name = "qaagenticai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Wanda Hayes", email = "whayeswsfg@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "deepeval>=4.2.2",
    "docling-ibm-models>=4.0.3",
    "langchain>=1.4.0",
    "langchain-docling>=3.0.0",
    "langchain-openai>=1.6.0",
    "langchain-text-splitters>=1.1.2",
    "openai>=3.8.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
]

[project.scripts]
qaagenticai = "qaagenticai:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
